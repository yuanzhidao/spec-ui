[package]
name = "spec-ui-desktop"
version = "0.0.2"
description = "Desktop shell for spec-ui"
authors = ["spec-ui contributors"]
license = "Apache-2.0"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "spec_ui_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
portable-pty = "0.9.0"
time = { version = "0.3", features = ["formatting"] }
