name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  NODE_VERSION: "22.22.2"
  PNPM_VERSION: "10"

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release-version.outputs.tag }}
      version: ${{ steps.release-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Verify release version
        id: release-version
        run: node scripts/verify-release-version.mjs --tag "${GITHUB_REF_NAME}"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            patchelf \
            libfuse2t64 \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Validate OpenSpec
        run: pnpm spec:validate

      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Prepare Node sidecar for Rust check
        run: pnpm desktop:prepare-sidecar

      - name: Rust check
        working-directory: src-tauri
        run: cargo check

      - name: Web build
        run: pnpm build

  package:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            arch: arm64
            os: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
          - platform: macos
            arch: x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
          - platform: windows
            arch: x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Verify release version
        run: node scripts/verify-release-version.mjs --tag "${{ needs.verify.outputs.tag }}"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop package
        run: pnpm desktop:build --ci --no-sign --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Collect release artifacts
        run: >
          node scripts/collect-tauri-artifacts.mjs
          --version ${{ needs.verify.outputs.version }}
          --target ${{ matrix.target }}
          --platform ${{ matrix.platform }}
          --arch ${{ matrix.arch }}

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spec-ui-${{ needs.verify.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-artifacts/*
          if-no-files-found: error

  draft-release:
    needs:
      - verify
      - package
    if: github.repository == 'yuanzhidao/spec-ui'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: spec-ui-${{ needs.verify.outputs.version }}-*
          path: release-artifacts
          merge-multiple: true

      - name: Generate release notes
        run: >
          node scripts/generate-release-notes.mjs
          --tag ${{ needs.verify.outputs.tag }}
          --output release-notes.md

      - name: Create or update draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          node scripts/publish-draft-release.mjs
          --tag ${{ needs.verify.outputs.tag }}
          --artifacts release-artifacts
          --notes release-notes.md
