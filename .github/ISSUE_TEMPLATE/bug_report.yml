name: Bug report
description: Report something that is not working as expected.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include enough detail for maintainers to reproduce it.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide a minimal sequence of actions.
      placeholder: |
        1. Add project ...
        2. Open ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Web app
        - Desktop shell
        - Local runtime
        - OpenSpec adapter
        - Project discovery
        - Validation
        - Documentation
        - Other
    validations:
      required: true
  - type: dropdown
    id: project_structure
    attributes:
      label: Spec/project structure
      description: Choose the closest match for the project that exposes the issue.
      options:
        - OpenSpec root
        - Monorepo with multiple OpenSpec scopes
        - No spec structure detected
        - Not sure
        - Other
    validations:
      required: true
  - type: dropdown
    id: app_mode
    attributes:
      label: App mode or build source
      description: How were you running spec-ui when the issue happened?
      options:
        - Web dev server
        - Desktop preview build
        - GitHub Release artifact
        - Source build
        - Not sure
        - Other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.7, Windows 11, Ubuntu 24.04
  - type: input
    id: node
    attributes:
      label: Node.js and pnpm versions
      placeholder: Node 22.x, pnpm 10.x
  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots, or recordings
      description: Drag files here or paste relevant logs.
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submit checks
      options:
        - label: I searched existing issues before opening this report.
          required: true
        - label: I did not include sensitive project data or credentials.
          required: true
        - label: I am willing to help test a fix or submit a pull request.
